<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Bootstrap practice</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"><link rel="stylesheet" href="styles.css"></head>
<body class="text-center"><main class="form-signin"><form id="login-form"><img src="bootstrap.svg" alt="Bootstrap practice" class="mb-4" width="72" height="72"><h1 class="h3 mb-3 fw-normal">Please sign in</h1><label for="email" class="visually-hidden">Email address</label><input id="email" name="email" type="email" class="form-control" placeholder="Email address" autocomplete="email" required autofocus><label for="password" class="visually-hidden">Password</label><input id="password" name="password" type="password" class="form-control" placeholder="Password" autocomplete="current-password" required><div class="form-check d-inline-flex gap-2 mb-3"><input id="remember" type="checkbox" class="form-check-input"><label for="remember" class="form-check-label">Remember me</label></div><button class="btn btn-lg btn-primary w-100" type="submit">Sign in</button><p id="result" class="mt-3 text-success" role="status"></p><p class="mt-5 mb-3 text-body-secondary">© 2017–2018</p><small class="text-body-secondary">Layout demo. Credentials are never sent or saved.</small></form></main><script src="login.js"></script></body></html>
